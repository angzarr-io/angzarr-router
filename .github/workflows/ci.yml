# Thin CI: tool setup, then just recipes. All logic lives in the justfile;
# every recipe runs in the org's pinned toolchain image. Codegen never touches
# the Buf Schema Registry: protos come from the angzarr-project submodule.
# The C ABI's bindings are generated by tools/abigen (the Python layer is
# checked by its tests); the hand-written per-language bindings are retired.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Toolchains run as container-root so their HOME-based caches work.
  ANGZARR_CONTAINER_USER: "0:0"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: extractions/setup-just@v2

      - name: Format
        run: just fmt-check

      - name: Clippy
        run: just lint

      - name: Architecture lint
        run: just archlint

      - name: Unit tests and conformance (Rust)
        run: just test

      - name: Lint protos
        run: just buf-lint

      - name: Proto format
        run: just buf-format
