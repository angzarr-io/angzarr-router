# The mutation full pass, weekly and by hand: `just mutation-test` mutates
# every file in MUTATED (justfile.container) and fails on any surviving
# mutant. No git hook runs mutation; `mutation-push` judges what a push adds,
# by hand, and this pass catches what has drifted under it. Set up as ci.yml is: the recipe
# runs in the org's pinned toolchain image, protos from the angzarr-project
# submodule.
name: mutation

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  # Toolchains run as container-root so their HOME-based caches work.
  ANGZARR_CONTAINER_USER: "0:0"

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    # GitHub's cap for a hosted job; let the full pass finish rather than
    # cancel it mid-run.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: extractions/setup-just@v2

      - name: Mutation test (full pass)
        run: just mutation-test

      - name: Surviving mutants
        if: always()
        run: |
          for f in mutants.out/missed.txt mutants.out/timeout.txt; do
            [ -f "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
