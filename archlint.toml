# Architecture rules for angzarr-router, checked by `just archlint`
# (tools/archlint; pattern syntax and rule semantics in
# tools/archlint/src/rules.rs). `cargo run -p archlint -- --edges` prints the
# module graph these rules are checked against.
#
# Crate layers, bottom to top:
#   angzarr-proto               the io.angzarr.v1 wire types (angzarr-project's
#                               rust/angzarr-proto, a path dependency)
#   angzarr_router              the engine: dispatch, component model, rebuild
#   angzarr_router_ffi          the C ABI over the engine (marshaling, registry)
#   angzarr_router_conformance  the harness: drives the engine's public API
#   angzarr_abigen              tooling: generates the ABI's bindings from
#                               abi.proto; only tests depend on it
#   archlint                    tooling; no product crate depends on it
#
# `allow` lists the ONLY workspace targets a module may reference (external
# crates are constrained by `deny` alone); `self::**` is the module's own
# subtree.

# ---- crate layers ----------------------------------------------------------

[[rule]]
name = "engine-is-the-bottom"
why = "the engine never depends on the C ABI layer, the conformance harness, tooling, or C FFI types; its wire types come from angzarr-project's angzarr-proto crate"
from = ["angzarr_router::**"]
allow = ["angzarr_router::**", "path:angzarr-project/rust/angzarr-proto"]
deny = ["std::ffi::**", "core::ffi::**", "std::os::raw::**", "libc::**"]

[[rule]]
name = "ffi-sits-on-the-engine"
why = "the C ABI layer marshals over the engine; it never reaches the harness or tooling"
from = ["angzarr_router_ffi::**"]
scope = "lib"
allow = ["angzarr_router_ffi::**", "angzarr_router::**", "path:proto/io/angzarr/router/ffi/v1/abi.proto"]

[[rule]]
name = "abigen-reads-only-the-abi-definition"
why = "the generator's input is abi.proto alone (its descriptor and bytes); it links no product crate, so a binding generated from it cannot depend on the engine's Rust"
from = ["angzarr_abigen::**"]
scope = "lib"
allow = ["angzarr_abigen::**", "path:proto/io/angzarr/router/ffi/v1/abi.proto"]

[[rule]]
name = "conformance-drives-the-public-engine"
why = "the harness library exercises the engine's public API and the conformance fixtures, never the C ABI"
from = ["angzarr_router_conformance::**"]
scope = "lib"
allow = ["angzarr_router_conformance::**", "angzarr_router::**", "path:conformance/fixtures/**"]

[[rule]]
name = "conformance-tests-use-public-surfaces"
why = "conformance tests drive the engine's public API, or the C ABI as a binding does (the `*_ffi` targets, through angzarr-router-ffi's host), never the ABI's internals"
from = ["angzarr_router_conformance::**"]
scope = "test"
allow = [
    "angzarr_router_conformance::**",
    "angzarr_router::**",
    "angzarr_router_ffi",
    "angzarr_router_ffi::abi_pb::**",
    "angzarr_router_ffi::host::**",
    "path:conformance/**",
]

# ---- engine internals (library code) ----------------------------------------

[[rule]]
name = "engine-proto-is-a-leaf"
why = "generated proto types reference nothing else in the engine"
from = ["angzarr_router::proto::**"]
scope = "lib"
allow = ["angzarr_router::proto::**"]

[[rule]]
name = "engine-error-is-a-leaf"
why = "the coded-error vocabulary references nothing else in the engine"
from = ["angzarr_router::error::**"]
scope = "lib"
allow = ["angzarr_router::error::**"]

[[rule]]
name = "engine-kernel-below-components"
why = "the shared kernel (crate-root helpers, rebuild, conflict, context, descriptor) sits below the component dispatchers and the router"
from = ["angzarr_router", "angzarr_router::rebuild::**", "angzarr_router::conflict::**", "angzarr_router::context::**", "angzarr_router::descriptor::**"]
scope = "lib"
allow = [
    "angzarr_router",
    "path:angzarr-project/rust/angzarr-proto",
    "angzarr_router::proto::**",
    "angzarr_router::error::**",
    "angzarr_router::rebuild::**",
    "angzarr_router::conflict::**",
    "angzarr_router::context::**",
    "angzarr_router::descriptor::**",
]

[[rule]]
name = "engine-components-are-independent"
why = "each component dispatcher builds on the kernel only, never on another component or the router that composes them"
from = [
    "angzarr_router::domain::**",
    "angzarr_router::policy::**",
    "angzarr_router::projector::**",
    "angzarr_router::upcaster::**",
]
scope = "lib"
allow = [
    "self::**",
    "angzarr_router",
    "angzarr_router::proto::**",
    "angzarr_router::error::**",
    "angzarr_router::rebuild::**",
    "angzarr_router::conflict::**",
    "angzarr_router::context::**",
    "angzarr_router::descriptor::**",
]

# ---- C ABI internals (library code) -----------------------------------------

[[rule]]
name = "ffi-proto-is-a-leaf"
why = "the ABI's generated proto types reference nothing else"
from = ["angzarr_router_ffi::proto::**"]
scope = "lib"
allow = ["angzarr_router_ffi::proto::**"]

[[rule]]
name = "ffi-abi-below-registry"
why = "buffer/status marshaling sits below the registry and the exported entry points"
from = ["angzarr_router_ffi::abi::**"]
scope = "lib"
# abi.proto's bytes: the ABI version is their hash.
allow = ["self::**", "angzarr_router_ffi::proto::**", "angzarr_router::**", "path:proto/io/angzarr/router/ffi/v1/abi.proto"]

[[rule]]
name = "ffi-registry-below-entry-points"
why = "the registry adapts host callbacks to engine components; the extern \"C\" entry points sit above it"
from = ["angzarr_router_ffi::registry::**"]
scope = "lib"
allow = ["self::**", "angzarr_router_ffi::abi::**", "angzarr_router_ffi::proto::**", "angzarr_router::**"]

[[rule]]
name = "ffi-host-is-a-binding"
why = "the Rust host drives the router through the exported entry points only, as a foreign binding does; it never reaches the registry"
from = ["angzarr_router_ffi::host::**"]
scope = "lib"
allow = [
    "self::**",
    "angzarr_router_ffi",
    "angzarr_router_ffi::abi::**",
    "angzarr_router_ffi::proto::**",
    "angzarr_router::**",
]
