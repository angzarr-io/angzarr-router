syntax = "proto3";
package io.angzarr.router.ffi.v1;

import "google/protobuf/any.proto";
import "io/angzarr/v1/types.proto";

// Auxiliary payloads crossing the C ABI. These are internal to the FFI
// boundary and versioned with the ABI (angzarr_abi_version) — they are
// NOT wire protocol and never leave the process.
//
// Errors cross the boundary as google.rpc.Status bytes carrying a
// google.rpc.ErrorInfo detail (reason = SCREAMING_SNAKE code, domain
// "angzarr.io", metadata = extras) — the exact shape gRPC serializes on
// the wire; no invented error proto.

// One (fully-qualified type name → host callback) table row.
message CallbackEntry {
  string fq_type = 1;
  uint64 callback_id = 2;
}

// Registration payload for one aggregate component: the dispatch tables
// the binding's registration API (and later, generated wiring) assembles.
message AggregateDescriptor {
  string name = 1;
  string domain = 2;
  repeated CallbackEntry commands = 3;
  repeated CallbackEntry appliers = 4;
  // Field 5 was `rejections` (compensation input; removed — there is no
  // compensation input).
  reserved 5;
  reserved "rejections";
  // Snapshot loader callback; absent when the aggregate takes no snapshots.
  optional uint64 snapshot_callback_id = 6;
  // Field 7 was `undoes` (Compensate input; removed).
  reserved 7;
  reserved "undoes";
  // Fact handlers keyed by FULLY-QUALIFIED fact type: a command page whose
  // Fact arm carries that type runs its handler. The callback receives the
  // fact Any (type_url / payload) with the session state rebuilt, and returns
  // a serialized FactRecord (STATUS_OK) or STATUS_OK_EMPTY to record the fact
  // unchanged with no flags. A fact of an unregistered type never reaches
  // the host: the router refuses it with NO_FACT_HANDLER.
  repeated CallbackEntry facts = 8;
  // Field 9 was `state_callback_id` (Replay; removed — there is no Replay
  // RPC).
  reserved 9;
  reserved "state_callback_id";
  // The rules version reported on every response
  // (CommandHandlerResponse.rules_version): the business binary's full
  // version string, baked in at build.
  string rules_version = 10;
  // COMMUTATIVE conflict resolution (options.proto, the conflict_units
  // region). Packs the session's current state into a serialized
  // google.protobuf.Any; the router captures the state at the expected
  // sequence, at the head and after the command's events, and restores the
  // head through the snapshot loader (snapshot_callback_id).
  optional uint64 pack_state_callback_id = 12;
  // The state's generated changed(before, after): payload a serialized
  // ChangedCall, response a serialized ChangedUnits. Its presence turns
  // COMMUTATIVE on; it needs pack_state_callback_id and snapshot_callback_id
  // (registration refuses it without them: INCOMPLETE_COMMUTATIVE).
  optional uint64 changed_callback_id = 13;
  // The upcaster chain run on incoming command and fact payloads before
  // dispatch (upcaster.proto), in order: a rule's callback receives a payload
  // of type `fq_type` and returns the upcast serialized google.protobuf.Any
  // (STATUS_OK_EMPTY: unchanged).
  repeated CallbackEntry command_upcasters = 14;
}

// Response bytes of a command callback (STATUS_OK): the events (payloads
// only) and, under AGGREGATE_HANDLES, the nonce the handler resolved the
// conflict window with (the spec's resolve_conflicts(window, nonce)). The
// router keeps the events only when resolved_nonce is exactly the delivered
// conflict_nonce; otherwise CONFLICT_UNRESOLVED (ABORTED).
message CommandOutput {
  io.angzarr.v1.EventBook events = 1;
  bytes resolved_nonce = 2;
}

// Payload of a changed callback: two serialized states (pack_state images).
message ChangedCall {
  google.protobuf.Any before = 1;
  google.protobuf.Any after = 2;
}

// Response bytes of a changed callback: the unit paths whose values differ
// (options.proto, the conflict_units region).
message ChangedUnits {
  repeated string units = 1;
}

// Response bytes of a fact callback (STATUS_OK): the fact to record (as
// received, or annotated) and the events that flag it, in order — the fact
// command's events, payloads only.
message FactRecord {
  google.protobuf.Any fact = 1;
  repeated google.protobuf.Any flags = 2;
}

// Registration payload for one projector component. Folds cross the
// callback (the host owns the projection instance); finish packs it into
// the wire Projection. Empty `domains` consumes every domain.
message ProjectorDescriptor {
  string name = 1;
  repeated string domains = 2;
  repeated CallbackEntry events = 3;
  // Packs the folded projection into the wire Projection; absent → the core
  // returns a default Projection (cover + name only).
  optional uint64 finish_callback_id = 4;
  // Field 5 was `unknown_callback_id` (removed — events with no fold thunk
  // are skipped and the core logs a warn).
  reserved 5;
  reserved "unknown_callback_id";
}

// Registration payload for one saga component. A stateless translator:
// declared events emit commands, passed through as emitted (the coordinator
// stamps their identity and provenance). Empty `target_domains` is allowed.
message SagaDescriptor {
  string name = 1;
  string input_domain = 2;
  repeated string target_domains = 3;
  repeated CallbackEntry events = 4;
  // Field 5 was `rejections` (compensation input; removed).
  reserved 5;
  reserved "rejections";
}

// aux payload for command-handler callbacks.
message CommandContextAux {
  uint64 next_sequence = 1;
  bool had_prior_events = 2;
  // The cover of the command being handled: the aggregate's own domain and
  // root.
  io.angzarr.v1.Cover cover = 3;
  // The resolved Handling (types.proto): the expected sequence and the
  // conflict resolution.
  uint64 expected_sequence = 4;
  io.angzarr.v1.ConflictResolution conflict_resolution = 5;
  // AGGREGATE_HANDLES only: the delivered nonce and the conflict window (the
  // pages at sequences expected_sequence..head). The host hands the nonce
  // back in CommandOutput.resolved_nonce once its handler resolved.
  bytes conflict_nonce = 6;
  repeated io.angzarr.v1.EventPage window = 7;
}

// aux payload for saga event callbacks: the source event's cover passed
// through whole (serialized angzarr Cover) so the saga can route emitted
// commands by the trigger's identity. The host returns a SagaResponse whose
// `commands` are taken as emitted.
message SagaEventAux {
  reserved 1;
  reserved "destination_sequences";
  // The source book's cover, passed through whole and typed (Rust owns the
  // deserialization) so the saga can route emitted commands by the trigger's
  // identity.
  io.angzarr.v1.Cover source_cover = 2;
  // The source event's sequence.
  uint64 source_seq = 3;
}

// Registration payload for one process-manager component. STATEFUL: the PM
// rebuilds its own event-sourced state (the appliers/snapshot) before each
// handler. Event handlers are keyed by (input domain, fully-qualified event
// type) — a 2-level table. `target_domains` are the PM's declared output
// domains (its command targets).
message ProcessManagerDescriptor {
  string name = 1;
  string pm_domain = 2;
  repeated CallbackEntry appliers = 3; // rebuild the PM's own state
  optional uint64 snapshot_callback_id = 4;
  repeated PmEventEntry events = 5;
  // Field 6 was `rejections` (compensation input; removed).
  reserved 6;
  reserved "rejections";
  repeated string target_domains = 7;
  // Field 8 was `state_callback_id` (Replay; removed).
  reserved 8;
  reserved "state_callback_id";
  // The rules version reported on every response
  // (ProcessManagerHandleResponse.rules_version), as on AggregateDescriptor.
  string rules_version = 9;
}

// One ((input domain, fully-qualified event type) → host callback) row for a
// process manager's 2-level handler table.
message PmEventEntry {
  string input_domain = 1;
  string fq_type = 2;
  uint64 callback_id = 3;
}

// aux payload for process-manager event callbacks: the trigger book's cover.
// The host returns a ProcessManagerHandleResponse, taken as emitted.
message PmEventAux {
  reserved 1;
  reserved "destination_sequences";
  io.angzarr.v1.Cover trigger_cover = 2;
}

// aux payload for projector fold callbacks AND for aggregate / process-manager
// applier callbacks: where the folded event sits (its book's cover and the
// page's sequence).
message ProjectorEventAux {
  io.angzarr.v1.Cover cover = 1;
  uint64 sequence = 2;
}
