syntax = "proto3";
package io.angzarr.router.ffi.v1;

import "google/protobuf/any.proto";
import "io/angzarr/v1/types.proto";

// Auxiliary payloads crossing the C ABI. These are internal to the FFI
// boundary and versioned with the ABI (angzarr_abi_version) — they are
// NOT wire protocol and never leave the process.
//
// Errors cross the boundary as google.rpc.Status bytes carrying a
// google.rpc.ErrorInfo detail (reason = SCREAMING_SNAKE code, domain
// "angzarr.io", metadata = extras) — the exact shape gRPC serializes on
// the wire; no invented error proto.

// One (fully-qualified type name → host callback) table row.
message CallbackEntry {
  string fq_type = 1;
  uint64 callback_id = 2;
}

// Registration payload for one aggregate component: the dispatch tables
// the binding's registration API (and later, generated wiring) assembles.
//
// Router-owned state: the router holds the aggregate's state as a serialized
// google.protobuf.Any of the registered `state_type_url` and hands it to
// every callback; the host keeps none. The initial state is a delivered
// snapshot's `state` (pages at or below its sequence are covered) or, with
// none, `Any { type_url: "/" + state_type_url, value: [] }` (the message's
// default). Rebuilding folds every uncovered page through ONE fold call.
message AggregateDescriptor {
  string name = 1;
  string domain = 2;
  // Deciders keyed by FULLY-QUALIFIED command type: payload the command,
  // aux a CommandContextAux carrying the state; STATUS_OK answers a
  // CommandOutput, STATUS_OK_EMPTY no events.
  repeated CallbackEntry commands = 3;
  // Field 4 was `appliers` (per-event host folds into session state;
  // replaced by fold_callback_id over router-owned state).
  reserved 4;
  reserved "appliers";
  // Field 5 was `rejections` (compensation input; removed — there is no
  // compensation input).
  reserved 5;
  reserved "rejections";
  // Field 6 was `snapshot_callback_id` (a delivered snapshot is now the
  // initial state the router passes in).
  reserved 6;
  reserved "snapshot_callback_id";
  // Field 7 was `undoes` (Compensate input; removed).
  reserved 7;
  reserved "undoes";
  // Fact handlers keyed by FULLY-QUALIFIED fact type: a command page whose
  // Fact arm carries that type runs its handler. The callback receives the
  // fact Any (type_url / payload) with a CommandContextAux carrying the
  // rebuilt state, and returns
  // a serialized FactRecord (STATUS_OK) or STATUS_OK_EMPTY to record the fact
  // unchanged with no flags. A fact of an unregistered type never reaches
  // the host: the router refuses it with NO_FACT_HANDLER.
  repeated CallbackEntry facts = 8;
  // Field 9 was `state_callback_id` (Replay; removed — there is no Replay
  // RPC).
  reserved 9;
  reserved "state_callback_id";
  // The rules version reported on every response
  // (CommandHandlerResponse.rules_version): the business binary's full
  // version string, baked in at build.
  string rules_version = 10;
  // The state message's fully-qualified name (e.g. "orders.v1.OrderState").
  string state_type_url = 11;
  // The fold: payload a serialized FoldCall (the state, every uncovered page
  // of the rebuild, the book's cover); STATUS_OK answers the new state as a
  // serialized google.protobuf.Any, STATUS_OK_EMPTY leaves it unchanged. A
  // failure fills `out` with a FoldFailure and is a handler bug (INTERNAL;
  // see FoldFailure). Absent: events never change the state.
  optional uint64 fold_callback_id = 12;
  // COMMUTATIVE conflict resolution (options.proto, the conflict_units
  // region): the state's generated changed(before, after), payload a
  // serialized ChangedCall of two states, response a serialized
  // ChangedUnits. Its presence turns COMMUTATIVE on.
  optional uint64 changed_callback_id = 13;
  // The upcaster chain run on incoming command and fact payloads before
  // dispatch (upcaster.proto), in order: a rule's callback receives a payload
  // of type `fq_type` and returns the upcast serialized google.protobuf.Any
  // (STATUS_OK_EMPTY: unchanged).
  repeated CallbackEntry command_upcasters = 14;
}

// Response bytes of a command callback (STATUS_OK): the events (payloads
// only) and, under AGGREGATE_HANDLES, the nonce the handler resolved the
// conflict window with (the spec's resolve_conflicts(window, nonce)). The
// router keeps the events only when resolved_nonce is exactly the delivered
// conflict_nonce; otherwise CONFLICT_UNRESOLVED (ABORTED).
message CommandOutput {
  io.angzarr.v1.EventBook events = 1;
  bytes resolved_nonce = 2;
}

// Payload of a fold callback: the current state and the pages to fold into
// it, in order, with their book's cover.
message FoldCall {
  google.protobuf.Any state = 1;
  repeated io.angzarr.v1.EventPage pages = 2;
  io.angzarr.v1.Cover cover = 3;
}

// Failure output of a fold callback (aggregate, process manager, projector):
// a failing fold fills `out` with it, from the one batched call. page_index
// is the failing page's index within the FoldCall's pages, filled by the
// host's fold loop; it is optional so that index 0 is distinguishable from
// no index. The router names that page's sequence and type URL in an
// INTERNAL error (a failing fold of accepted events is a handler bug); with
// no FoldFailure, or an index outside the batch, it names the batch's
// first..last sequence range instead. The router never calls the fold again.
message FoldFailure {
  optional uint32 page_index = 1;
  string message = 2;
}

// Payload of a changed callback: two states.
message ChangedCall {
  google.protobuf.Any before = 1;
  google.protobuf.Any after = 2;
}

// Response bytes of a changed callback: the unit paths whose values differ
// (options.proto, the conflict_units region).
message ChangedUnits {
  repeated string units = 1;
}

// Response bytes of a fact callback (STATUS_OK): the fact to record (as
// received, or annotated) and the events that flag it, in order — the fact
// command's events, payloads only.
message FactRecord {
  google.protobuf.Any fact = 1;
  repeated google.protobuf.Any flags = 2;
}

// Registration payload for one projector component. Router-owned like an
// aggregate's state: each delivery starts from the projection message's
// default (`Any { type_url: "/" + projection_type_url, value: [] }`), and a
// book from a declared domain (empty `domains`: every domain) is folded
// through ONE stateless fold call (payload a FoldCall whose `state` is the
// projection; STATUS_OK answers the new projection as a serialized
// google.protobuf.Any, STATUS_OK_EMPTY leaves it unchanged; a failure fills
// `out` with a FoldFailure and is a handler bug, as an aggregate's). The router answers the Projection itself: the book's
// cover, the projector's name, the folded projection, and next_sequence =
// the last page's sequence + 1 (the book's next_sequence when it has no
// pages).
message ProjectorDescriptor {
  string name = 1;
  repeated string domains = 2;
  // Fields 3 and 4 were `events` (per-type host folds into a session
  // instance) and `finish_callback_id` (the router now builds the
  // Projection).
  reserved 3, 4;
  reserved "events", "finish_callback_id";
  // Field 5 was `unknown_callback_id` (removed — events with no fold thunk
  // are skipped and the core logs a warn).
  reserved 5;
  reserved "unknown_callback_id";
  // The projection message's fully-qualified name.
  string projection_type_url = 6;
  // The fold over the projection (see above).
  optional uint64 fold_callback_id = 7;
  // The business binary's full version, baked in at build: carried on the
  // projector's registration hello (ComponentDescriptor.rules_version).
  string rules_version = 8;
}

// Registration payload for one saga component. A stateless translator
// between exactly two domains (decision 14.24): events of its one source
// domain (`input_domain`) emit commands for its one destination domain
// (`output_domain`), passed through as emitted (the coordinator stamps their
// identity and provenance). An answer holding a command whose cover names
// any other domain is a saga bug: the router refuses it INTERNAL
// (SAGA_COMMAND_OUTSIDE_DESTINATION) with no commands.
message SagaDescriptor {
  string name = 1;
  string input_domain = 2;
  // Field 3 was `target_domains` (several destinations; a saga has one).
  reserved 3;
  reserved "target_domains";
  repeated CallbackEntry events = 4;
  // Field 5 was `rejections` (compensation input; removed).
  reserved 5;
  reserved "rejections";
  // The business binary's full version, baked in at build: carried on the
  // saga's registration hello (ComponentDescriptor.rules_version).
  string rules_version = 6;
  // The saga's one destination domain (ComponentOptions.output_domain).
  string output_domain = 7;
}

// aux payload for command-handler callbacks.
message CommandContextAux {
  uint64 next_sequence = 1;
  bool had_prior_events = 2;
  // The cover of the command being handled: the aggregate's own domain and
  // root.
  io.angzarr.v1.Cover cover = 3;
  // The resolved Handling (types.proto): the expected sequence and the
  // conflict resolution.
  uint64 expected_sequence = 4;
  io.angzarr.v1.ConflictResolution conflict_resolution = 5;
  // AGGREGATE_HANDLES only: the delivered nonce and the conflict window (the
  // pages at sequences expected_sequence..head). The host hands the nonce
  // back in CommandOutput.resolved_nonce once its handler resolved.
  bytes conflict_nonce = 6;
  repeated io.angzarr.v1.EventPage window = 7;
  // The rebuilt state (router-owned; see AggregateDescriptor).
  google.protobuf.Any state = 8;
}

// aux payload for saga event callbacks: the source event's cover passed
// through whole (serialized angzarr Cover) so the saga can route emitted
// commands by the trigger's identity. The host returns a SagaResponse whose
// `commands` are taken as emitted.
message SagaEventAux {
  reserved 1;
  reserved "destination_sequences";
  // The source book's cover, passed through whole and typed (Rust owns the
  // deserialization) so the saga can route emitted commands by the trigger's
  // identity.
  io.angzarr.v1.Cover source_cover = 2;
  // The source event's sequence.
  uint64 source_seq = 3;
}

// Registration payload for one process-manager component. STATEFUL: the PM
// rebuilds its own event-sourced state (the appliers/snapshot) before each
// handler. Event handlers are keyed by (input domain, fully-qualified event
// type) — a 2-level table. `target_domains` are the PM's declared output
// domains (its command targets).
message ProcessManagerDescriptor {
  string name = 1;
  string pm_domain = 2;
  // Fields 3 and 4 were `appliers` and `snapshot_callback_id`: the PM's state
  // is router-owned, as an aggregate's (state_type_url, fold_callback_id).
  reserved 3, 4;
  reserved "appliers", "snapshot_callback_id";
  repeated PmEventEntry events = 5;
  // Field 6 was `rejections` (compensation input; removed).
  reserved 6;
  reserved "rejections";
  repeated string target_domains = 7;
  // Field 8 was `state_callback_id` (Replay; removed).
  reserved 8;
  reserved "state_callback_id";
  // The rules version reported on every response
  // (ProcessManagerHandleResponse.rules_version), as on AggregateDescriptor.
  string rules_version = 9;
  // The PM state message's fully-qualified name; its state is router-owned
  // exactly as an aggregate's (see AggregateDescriptor).
  string state_type_url = 10;
  // The fold over the PM's own events, as AggregateDescriptor.fold_callback_id.
  optional uint64 fold_callback_id = 11;
}

// One ((input domain, fully-qualified event type) → host callback) row for a
// process manager's 2-level handler table.
message PmEventEntry {
  string input_domain = 1;
  string fq_type = 2;
  uint64 callback_id = 3;
}

// aux payload for process-manager event callbacks: the trigger book's cover
// and the PM's rebuilt state. The host returns a
// ProcessManagerHandleResponse, taken as emitted.
message PmEventAux {
  reserved 1;
  reserved "destination_sequences";
  io.angzarr.v1.Cover trigger_cover = 2;
  google.protobuf.Any state = 3;
}
