syntax = "proto3";
package io.angzarr.router.ffi.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "io/angzarr/v1/command_handler.proto";
import "io/angzarr/v1/policy.proto";
import "io/angzarr/v1/types.proto";

// The router's C ABI, as data (owner's ruling, 2026-10-29: a GENERIC,
// GENERATED C ABI). Internal to the FFI boundary: NOT wire protocol, never
// leaves the process.
//
// Shape. A binding registers ONE component with ONE call,
// angzarr_router_register(ComponentSpec), and drives it with ONE call,
// angzarr_router_dispatch(DispatchRequest) -> DispatchResponse. The
// component's business code is a list of ROLES, each one (Role, fully
// qualified type, callback id); the router calls a role back through the one
// host callback AngzarrCb(callback_id, type_url, payload, aux, out).
//
// The callback convention, the same for every role:
//   - type_url: the fully-qualified name of the role's Call message (e.g.
//     "io.angzarr.router.ffi.v1.DecideCall"), so a host invoker checks what
//     it was handed;
//   - payload: that Call message, serialized;
//   - aux: empty (reserved);
//   - out, on STATUS_OK (0): the role's Return message, serialized; on
//     STATUS_OK_EMPTY (1): nothing, read as the Return message's default;
//   - a negative return: the negated gRPC status, `out` a google.rpc.Status
//     carrying a google.rpc.ErrorInfo (reason = the key, domain angzarr.io,
//     metadata = the args) and, for a typed business refusal, the refusal
//     object as a second detail (decision 14.37). No English: the status
//     message is the key.
// Every role R pairs with the messages `<R>Call` and `<R>Return`, named
// from the enum value (ROLE_POLICY_EVENT: PolicyEventCall,
// PolicyEventReturn); a role with neither is a declaration and is never
// called back. The generator (tools/abigen) reads this pairing, and refuses
// a role with one message of the two.
//
// The ABI version (angzarr_abi_version) is derived from this file: the
// FNV-1a 32-bit hash of its bytes. Any edit is a new ABI, and a binding
// generated from another revision refuses to load.
//
// State crosses as a serialized google.protobuf.Any of the component's state
// type on every call that needs it; the router owns it, and a host keeps
// none between or within dispatches.

// What a callback does for the component (see the convention above).
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Domain (aggregate, process manager): the one batched fold over the
  // router-owned state. fq_type: unused (the spec's state_type is the
  // state). Absent: events never change the state.
  ROLE_FOLD = 1;
  // Domain: the command handler of one fully-qualified command type.
  ROLE_DECIDE = 2;
  // Domain: the fact handler of one fully-qualified fact type.
  ROLE_FACT = 3;
  // Domain: the handler of a passed-through refusal (the standard
  // CommandRefused) of one fully-qualified refused (foreign) command type:
  // the generated on_refused_<Command> (types.proto, refusal_facts).
  ROLE_REFUSED = 4;
  // Domain: COMMUTATIVE conflict resolution, the state's changed(before,
  // after). At most one; its presence turns COMMUTATIVE on.
  ROLE_CHANGED = 5;
  // Process manager: a DECLARATION, never called back: fq_type, a
  // registered command or fact type, may start an instance (options.proto,
  // CommandOptions.starts; advertised as ComponentDescriptor.starting_types).
  // callback_id: unused. The router applies the start rule itself when it
  // admits an input (DispatchRequest.admit).
  ROLE_STARTS = 6;
  // Policy: the translation of one fully-qualified source event type into
  // commands for the policy's one destination.
  ROLE_POLICY_EVENT = 7;
  // Policy: the TRANSLATE-mode callback for refusals of one
  // fully-qualified command type (policy.proto, Refusals). A refused
  // command of a type with none is passed through (the router builds the
  // CommandRefused).
  ROLE_POLICY_REFUSED = 8;
  // Projector: the one batched fold over the router-owned projection.
  // fq_type: unused (the spec's state_type is the projection).
  ROLE_PROJECT = 9;
}

// One role of the component: what (role), for which type (fq_type, fully
// qualified, no type-URL prefix), called back as (callback_id).
message RoleEntry {
  Role role = 1;
  string fq_type = 2;
  uint64 callback_id = 3;
}

// The one component a router hosts (owner ruling: one coordinator, one
// component, one business process). A second registration is refused
// DUPLICATE_COMPONENT; a role the kind does not take, ROLE_NOT_FOR_KIND
// (INTERNAL, args `role` and `component_kind`); a spec with no kind,
// MISSING_COMPONENT_KIND (INTERNAL).
message ComponentSpec {
  io.angzarr.v1.ComponentKind kind = 1;
  string name = 2;
  // AGGREGATE, PROCESS_MANAGER: the domain it owns. POLICY: its one source
  // (input) domain. PROJECTOR: unused (see domains).
  string domain = 3;
  // POLICY only: its one destination domain (ComponentOptions.output_domain).
  string output_domain = 4;
  // PROJECTOR only: the domains it consumes; empty, or holding "*", every
  // domain.
  repeated string domains = 5;
  // The fully-qualified name of the state message (AGGREGATE,
  // PROCESS_MANAGER) or projection message (PROJECTOR); unused for POLICY.
  string state_type = 6;
  // The business binary's full version, baked in at build.
  string rules_version = 7;
  // The kinds' roles: AGGREGATE takes FOLD, DECIDE, FACT, REFUSED, CHANGED;
  // PROCESS_MANAGER those and STARTS; POLICY takes POLICY_EVENT and
  // POLICY_REFUSED; PROJECTOR takes PROJECT.
  repeated RoleEntry roles = 8;
}

// One call into the hosted component: which service method it is.
message DispatchRequest {
  oneof request {
    // Domain: CommandHandlerService.Handle (a command, or a fact in the
    // page's Fact arm).
    io.angzarr.v1.ContextualCommand command = 1;
    // Domain: the rules an input meets before its handler runs
    // (deduplication, editions, a process manager's start rule). The
    // runtime calls it first and acts on the Admission.
    AdmitRequest admit = 2;
    // Policy: PolicyService.Handle, over a source book.
    io.angzarr.v1.EventBook policy = 3;
    // Policy: PolicyService.OnRefused.
    RefusalRequest refusal = 4;
    // Projector: ProjectorService.Handle.
    io.angzarr.v1.EventBook project = 5;
    // Any kind: ComponentService.Describe, the registration hello.
    Describe describe = 6;
  }
}

// The answer to a DispatchRequest, in the arm of the request's. A refusal
// or failure is the negative return and its google.rpc.Status instead.
message DispatchResponse {
  oneof response {
    io.angzarr.v1.CommandHandlerResponse command = 1;
    Admission admit = 2;
    io.angzarr.v1.PolicyResponse policy = 3;
    io.angzarr.v1.OnRefusedResponse refusal = 4;
    io.angzarr.v1.Projection project = 5;
    io.angzarr.v1.ComponentDescriptor describe = 6;
  }
}

// ComponentService.Describe's request: nothing (component.proto's
// DescribeRequest is empty).
message Describe {}

// What the runtime knows when an input reaches a domain, before its handler
// runs.
message AdmitRequest {
  // The input as delivered: its cover names the addressed stream; its
  // identity is stamped.
  io.angzarr.v1.CommandBook command = 1;
  // The events the addressed stream already holds under this input's id, in
  // sequence order.
  repeated io.angzarr.v1.EventPage recorded = 2;
  // The addressed stream holds any event, as read in the input's edition.
  bool stream_exists = 3;
}

// What admitting an input decides. A refusal (PM_NO_INSTANCE, a malformed
// input) is the negative return instead.
message Admission {
  oneof outcome {
    // Run the handler (DispatchRequest.command).
    Dispatch dispatch = 1;
    // Already applied: answer these events, DUPLICATE; the handler does not
    // run.
    Duplicate duplicate = 2;
    // A process manager's fact for a root with no instance, of a type it
    // does not declare as starting: skipped, answered APPLIED with no
    // events.
    Skip skip = 3;
  }
  message Dispatch {}
  message Duplicate {
    repeated io.angzarr.v1.EventPage events = 1;
  }
  message Skip {}
}

// PolicyService.OnRefused's request, and what the translating callback's
// context is built from.
message RefusalRequest {
  io.angzarr.v1.Refusal refusal = 1;
  // The ContextualCommand the refused command was delivered in, when the
  // runtime has it: the callback's CommandContext is built from it, as its
  // target's handler was handed it. Absent: from the refused command's book
  // alone (no next sequence, history flag or conflict).
  io.angzarr.v1.ContextualCommand delivered = 2;
}

// --- role messages --------------------------------------------------------

// What a handler is handed beyond its input and the state (the core's
// CommandContext).
message CommandContext {
  uint64 next_sequence = 1;
  bool had_prior_events = 2;
  // The cover of the input: its domain, root and edition.
  io.angzarr.v1.Cover cover = 3;
  // The resolved Handling.
  uint64 expected_sequence = 4;
  io.angzarr.v1.ConflictResolution conflict_resolution = 5;
  // AGGREGATE_HANDLES only: the delivered nonce (handed back in
  // DecideReturn.resolved_nonce) and the conflict window.
  bytes conflict_nonce = 6;
  repeated io.angzarr.v1.EventPage window = 7;
  // The input's identity, as delivered.
  io.angzarr.v1.UUID command_id = 8;
  io.angzarr.v1.UUID correlation_id = 9;
  // A fact's origin; unset for a command.
  io.angzarr.v1.FactOrigin fact_origin = 10;
  // When the input was accepted (ContextualCommand.recorded_at).
  google.protobuf.Timestamp recorded_at = 11;
}

// How a fold failed: the failing page's index within the call's pages, when
// known, and the fold's own failure as a key and args (decision 14.37:
// never text). The router answers FOLD_FAILED (or FOLD_FAILED_EMITTED)
// naming that page, or the batch's range, with the cause flattened in as
// `cause` and `cause.<arg>`.
message FoldFailure {
  optional uint32 page_index = 1;
  io.angzarr.v1.Diagnostic cause = 2;
}

message FoldCall {
  google.protobuf.Any state = 1;
  repeated io.angzarr.v1.EventPage pages = 2;
  io.angzarr.v1.Cover cover = 3;
}

// Neither arm (STATUS_OK_EMPTY): the state is unchanged.
message FoldReturn {
  oneof outcome {
    google.protobuf.Any state = 1;
    FoldFailure failure = 2;
  }
}

message DecideCall {
  google.protobuf.Any command = 1;
  google.protobuf.Any state = 2;
  CommandContext context = 3;
}

// The events (payloads only) and, under AGGREGATE_HANDLES, the nonce the
// handler resolved the window with.
message DecideReturn {
  io.angzarr.v1.EventBook events = 1;
  bytes resolved_nonce = 2;
}

message FactCall {
  google.protobuf.Any fact = 1;
  google.protobuf.Any state = 2;
  CommandContext context = 3;
}

// The fact to record (unset: as received) and the events that flag it.
message FactReturn {
  google.protobuf.Any fact = 1;
  repeated google.protobuf.Any flags = 2;
}

message RefusedCall {
  io.angzarr.v1.CommandRefused refused = 1;
  google.protobuf.Any state = 2;
  CommandContext context = 3;
}

// As FactReturn: the refusal fact to record (unset: as received) and its
// flags.
message RefusedReturn {
  google.protobuf.Any fact = 1;
  repeated google.protobuf.Any flags = 2;
}

message ChangedCall {
  google.protobuf.Any before = 1;
  google.protobuf.Any after = 2;
}

// The unit paths whose values differ (options.proto, conflict_units).
message ChangedReturn {
  repeated string units = 1;
}

message PolicyEventCall {
  google.protobuf.Any event = 1;
  // The source book's cover, the event's sequence and its metadata.
  io.angzarr.v1.Cover source_cover = 2;
  uint64 sequence = 3;
  io.angzarr.v1.EventMeta meta = 4;
}

// Commands for the policy's one destination, taken as emitted.
message PolicyEventReturn {
  repeated io.angzarr.v1.CommandBook commands = 1;
}

message PolicyRefusedCall {
  io.angzarr.v1.Refusal refusal = 1;
  CommandContext context = 2;
}

// A fact of the policy's source domain, packed.
message PolicyRefusedReturn {
  google.protobuf.Any fact = 1;
}

message ProjectCall {
  google.protobuf.Any projection = 1;
  repeated io.angzarr.v1.EventPage pages = 2;
  io.angzarr.v1.Cover cover = 3;
}

// Neither arm (STATUS_OK_EMPTY): the projection is unchanged.
message ProjectReturn {
  oneof outcome {
    google.protobuf.Any projection = 1;
    FoldFailure failure = 2;
  }
}
