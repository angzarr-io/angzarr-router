[package]
name = "angzarr-router-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
angzarr-router = { path = "../router" }
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = { version = "0.16", features = ["text-format"] }
uuid = { version = "1", features = ["v5"] }

[build-dependencies]
prost-build = { workspace = true }

[dev-dependencies]
angzarr-router-ffi = { path = "../router-ffi" }
sha2 = "0.10"
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"

[[test]]
name = "cucumber"
harness = false

[[test]]
name = "projector"
harness = false

[[test]]
name = "saga"
harness = false

[[test]]
name = "process_manager"
harness = false

[[test]]
name = "compensation"
harness = false

[[test]]
name = "context"
harness = false
