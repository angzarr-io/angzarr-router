[package]
name = "angzarr-router-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
angzarr-router = { path = "../router" }
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = { version = "0.16", features = ["text-format"] }
uuid = { version = "1", features = ["v5"] }

[build-dependencies]
# The framework protos the fixture pool imports: angzarr-proto's embedded
# copies, the very files the router's types were generated from.
angzarr-proto = { workspace = true }
prost-build = { workspace = true }

[dev-dependencies]
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"

[[test]]
name = "cucumber"
harness = false

[[test]]
name = "projector"
harness = false

[[test]]
name = "policy"
harness = false

[[test]]
name = "context"
harness = false

[[test]]
name = "handling"
harness = false

[lints]
workspace = true
