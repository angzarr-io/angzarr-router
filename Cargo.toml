[workspace]
resolver = "2"
members = ["crates/router", "crates/conformance", "tools/archlint"]
# The angzarr-project submodule's crates are standalone workspaces of their
# own (angzarr-proto declares `[workspace]`), consumed here as path
# dependencies only.
exclude = ["angzarr-project"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"

[workspace.dependencies]
# The io.angzarr.v1 wire types, from angzarr-core's angzarr-proto crate
# (moved there from angzarr-project's rust/), pinned by full commit as a git
# dependency, so a dependent that links the router and names the same rev
# gets ONE angzarr-proto crate and one set of types (backlog TG-1). A path
# dependency would give every dependent a second, incompatible copy.
# Lockstep: core's own angzarr-project submodule at this rev is the spec
# angzarr-proto is built from; keep this repository's angzarr-project
# submodule (the .proto files and the shared features) at that same commit
# (`just check-core-lockstep`). prost and prost-types match its.
angzarr-proto = { git = "https://github.com/angzarr-io/angzarr", rev = "d704afc21812225e7c536ef4055bf48a3ef821e9" }
# `MaybeSend`, `MaybeSync` and `BoxFuture`: one home for the target-split
# Send bound, the store ports' and the dispatch traits' alike (architecture
# review B1). The same core rev as angzarr-proto, so both name one crate.
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr", rev = "d704afc21812225e7c536ef4055bf48a3ef821e9" }
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
tracing = "0.1"
