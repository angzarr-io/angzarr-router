[workspace]
resolver = "2"
members = ["crates/router", "crates/conformance", "tools/archlint"]
# The angzarr-project submodule's crates are standalone workspaces of their
# own (angzarr-proto declares `[workspace]`), consumed here as path
# dependencies only.
exclude = ["angzarr-project"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"

[workspace.dependencies]
# The io.angzarr.v1 wire types, from angzarr-core's angzarr-proto crate
# (moved there from angzarr-project's rust/), pinned by full commit as a git
# dependency, so a dependent that links the router and names the same rev
# gets ONE angzarr-proto crate and one set of types (backlog TG-1). A path
# dependency would give every dependent a second, incompatible copy.
# It compiles every io.angzarr.v1 message, the service protos' too, so the
# router generates none. Lockstep: core's own angzarr-project submodule at
# this rev is the spec angzarr-proto is built from; keep this repository's
# angzarr-project submodule (now read only for the handler-contract tier's
# features and fixtures) at that same commit (`just check-core-lockstep`).
# prost and prost-types match its.
angzarr-proto = { git = "https://github.com/angzarr-io/angzarr", rev = "6d29855fa7b23f3e295d77d9ac9064fffa6f81df" }
# `MaybeSend`, `MaybeSync` and `BoxFuture`: one home for the target-split
# Send bound, the store ports' and the dispatch traits' alike (architecture
# review B1). The same core rev as angzarr-proto, so both name one crate.
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr", rev = "6d29855fa7b23f3e295d77d9ac9064fffa6f81df" }
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
tracing = "0.1"

# Complexity (architecture-fixes G2; taskloom's gate): clippy's defaults
# (cognitive complexity 25, 100 lines) except nesting, whose threshold is in
# clippy.toml. `just lint` denies warnings, and pre-commit runs it. Every
# crate inherits these (`[lints] workspace = true`).
[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
