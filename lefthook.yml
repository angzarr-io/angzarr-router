# Lefthook configuration for angzarr-router
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install (again after a hook is added or removed here: pre-push was)
# Bypass: none — fix the finding instead.

# Plant the in-submodule pre-commit guard in .git/modules/<name>/hooks/
# (angzarr-project/submodule.just) after checkouts and merges.
post-checkout:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

post-merge:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

pre-commit:
  parallel: false
  commands:
    # Block the commit if a submodule has uncommitted edits or untracked
    # files. Pointer-only bumps still pass.
    check-submodules-clean:
      run: just check-submodules-clean

    # Refuse commits whose staged files contain secrets (gitleaks).
    scan-secrets:
      run: just scan-secrets

    # Module-level layer rules (archlint.toml) over the Rust workspace.
    archlint:
      glob: "*.{rs,toml}"
      run: just archlint

# No mutation testing in any hook: it runs while tests are written and judged
# (`just mutation-push`, by hand), at the end of an unattended run, and in the
# scheduled CI full pass (`just mutation-test`, .github/workflows/mutation.yml).

# Red tests never reach the default branch: `just push-check` runs every test
# in each pushed commit's own tree (the justfile says how), refusing a push
# to the default branch whose tests fail and warning on any other branch.
# git's pushed refs are on stdin, and {1} is the remote's name. lefthook
# skips a pre-push command when it finds no files changed between HEAD and
# the remote, which says nothing of the refs pushed; a `{files}` in `run`
# turns that off, so `files` names one that is always there, and push-check
# ignores it.
pre-push:
  commands:
    push-check:
      use_stdin: true
      files: echo justfile
      run: just push-check {1} {files}
